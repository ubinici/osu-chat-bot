[corpus]
osu_wiki_path = "database/osu-wiki"
language = "en"
include_news = true

[artifacts]
path = "artifacts/rag"

[embedding]
model = "sentence-transformers/all-MiniLM-L6-v2"
# Optional cluster/local-cache controls:
# cache_folder = "D:/hf-cache"
# device = "cuda"
# local_files_only = true

[qdrant]
url = "file://artifacts/rag/qdrant"
collection = "osu_wiki_en_dense_v2"
vector_size = 384

[retrieval]
top_k = 6
alias_artifact = "document_aliases.jsonl"
alias_minimum_confidence = 0.85
alias_minimum_tokens = 2
preferred_document_limit = 4
soft_preferred_document_limit = 1
canonical_source_types = ["wiki"]
temporal_source_types = ["wiki", "news"]
excluded_chunk_types = ["citation", "formula"]

[generation]
provider = "ollama"
url = "https://ollama.com"
model = "gpt-oss:20b"
think = "low"
temperature = 0.1
timeout_seconds = 120
# style_profile_path = "artifacts/style/osu_chat_style.json"
max_concurrent_requests = 4

[discord]
api_url = "http://127.0.0.1:8000"
feedback_path = "artifacts/feedback/events.jsonl"
session_db_path = "artifacts/feedback/discord_sessions.sqlite3"
answer_version = "gpt-oss-discord-v1"
ephemeral_answers = false
max_active_rooms = 4
inactivity_seconds = 300
context_turns = 8
# category_id = 123456789012345678
