services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: osu-chatbot:local
    restart: unless-stopped
    environment:
      HF_HOME: /home/app/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      OSU_BOT_QDRANT_URL: http://qdrant:6333
      OSU_BOT_QDRANT_COLLECTION: osu_wiki_en_dense_v2
      OSU_BOT_GENERATION_PROVIDER: ${OSU_BOT_GENERATION_PROVIDER:-ollama}
      OSU_BOT_GENERATION_URL: ${OSU_BOT_GENERATION_URL:-https://ollama.com}
      OSU_BOT_GENERATION_MODEL: ${OSU_BOT_GENERATION_MODEL:-gpt-oss:20b}
      OSU_BOT_GENERATION_API_KEY: ${OSU_BOT_GENERATION_API_KEY:-}
      OSU_BOT_GENERATION_THINK: ${OSU_BOT_GENERATION_THINK:-low}
      OSU_BOT_MAX_CONCURRENT_REQUESTS: ${OSU_BOT_MAX_CONCURRENT_REQUESTS:-4}
      OSU_BOT_STYLE_PROFILE_PATH: ${OSU_BOT_STYLE_PROFILE_PATH:-}
    ports:
      - "127.0.0.1:${OSU_BOT_PORT:-8000}:8000"
    volumes:
      - ../artifacts:/app/artifacts
      - ../database/osu-wiki:/app/database/osu-wiki:ro
      - huggingface_cache:/home/app/.cache/huggingface
    depends_on:
      - qdrant
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  discord:
    image: osu-chatbot:local
    restart: unless-stopped
    command: ["osu-bot", "discord"]
    environment:
      OSU_BOT_DISCORD_TOKEN: ${OSU_BOT_DISCORD_TOKEN:-}
      OSU_BOT_DISCORD_API_URL: http://app:8000
      OSU_BOT_DISCORD_GUILD_ID: ${OSU_BOT_DISCORD_GUILD_ID:-}
      OSU_BOT_DISCORD_FEEDBACK_PATH: /app/artifacts/feedback/events.jsonl
      OSU_BOT_DISCORD_EPHEMERAL: ${OSU_BOT_DISCORD_EPHEMERAL:-false}
      OSU_BOT_ANSWER_VERSION: ${OSU_BOT_ANSWER_VERSION:-gpt-oss-discord-v1}
    volumes:
      - ../artifacts:/app/artifacts
    depends_on:
      app:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:${QDRANT_IMAGE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  huggingface_cache:
  qdrant_data:
